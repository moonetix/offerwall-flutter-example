name: offerwall_flutter_example
description: "Flutter app that opens the Moonetix offerwall with a single-use session from your own server."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Moonetix offerwall plugin, from the Moonetix package repository.
  moonetix_offerwall:
    hosted: https://moonetix.com/pub
    version: ^2.0.0
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
